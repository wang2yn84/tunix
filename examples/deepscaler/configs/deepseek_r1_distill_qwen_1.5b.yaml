# DeepScaleR recipe: DeepSeek-R1-Distill-Qwen-1.5B on math reasoning
#
# Reference:
#   https://pretty-radio-b75.notion.site/DeepScaleR-Surpassing-O1-Preview-with-a-1-5B-Model-by-Scaling-RL-19681902c1468005bed8ca303013a4e2
#
# Usage:
#   python -m tunix.cli.deepscaler_main \
#       examples/deepscaler/configs/deepseek_r1_distill_qwen_1.5b.yaml
#
# Override individual keys on the command line, e.g.:
#   python -m tunix.cli.deepscaler_main \
#       examples/deepscaler/configs/deepseek_r1_distill_qwen_1.5b.yaml \
#       rollout_engine=vanilla \
#       grpo_config.num_generations=4

# ========================
# Model
# ========================
model_config:
  model_name: "deepseek_r1_distill_qwen_1_5b"
  model_id: "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"
  model_source: "huggingface"
  # model_path: "gs://tunix/models/DeepSeek-R1-Distill-Qwen-1.5B"
  model_version: "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"
  rng_seed: 42
  # Optional: uncomment to enable LoRA fine-tuning
  # train_with_lora: false
  # lora_config:
  #   rank: 64
  #   alpha: 64.0
  #   module_path: ".*q_einsum|.*kv_einsum|.*gate_proj|.*down_proj|.*up_proj|.*attn_vec_einsum"

tokenizer_config:
  tokenizer_type: "huggingface"
  tokenizer_path: "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"
  add_bos: false

# ========================
# Mesh (device assignment)
# ========================
# Trainer and rollout run on separate device partitions.
trainer_mesh:
  shape: "(4,1)"
  axis_names: "('fsdp','tp')"

rollout_mesh:
  shape: "(4,1)"
  axis_names: "('fsdp','tp')"

# ========================
# Data
# ========================
data_config:
  train_data_path: "gs://tunix/data/DeepScaleR-Preview-Dataset/deepscaler.json"
  eval_data_path: "gs://tunix/data/HuggingFaceH4/aime_2024/train-00000-of-00001.parquet"
  shuffle: false

seed: 42
batch_size: 128
mini_batch_size: 128
num_batches: 312
num_test_batches: 50
num_epochs: 3
train_fraction: 1.0

# ========================
# Rollout engine
# ========================
# One of: "vanilla", "vllm", "sglang_jax"
rollout_engine: "sglang_jax"
offload_to_cpu: false

rollout_config:
  max_prompt_length: 2048
  max_response_length: 8192
  temperature: 0.8
  top_p: 0.95
  top_k: null

# SGLang-JAX specific (only used when rollout_engine=sglang_jax)
sglang_jax_config:
  mem_fraction_static: 0.8
  init_with_random_weights: true
  disable_radix_cache: true
  enable_deterministic_sampling: false
  chunked_prefill_size: 2048
  page_size: 128
  use_sort_for_toppk_minp: false

# vLLM specific (only used when rollout_engine=vllm)
vllm_config:
  hbm_utilization: 0.4
  tpu_backend_type: "jax"
  server_mode: true
  async_scheduling: true
  max_num_seqs: 768
  kwargs:
    kv_cache_metrics: true
    disable_log_stats: false
    enable_prefix_caching: true

# ========================
# GRPO algorithm
# ========================
grpo_config:
  num_generations: 8
  num_iterations: 1
  beta: 0.0
  epsilon: 0.2
  epsilon_high: 0.28
  system_prompt: ""
  max_concurrency: 768
  off_policy_steps: 0
  loss_agg_mode: "token-mean"
  kl_loss_mode: "low_var_kl"

# ========================
# Optimizer
# ========================
optimizer_config:
  learning_rate: 1.0e-6
  b1: 0.9
  b2: 0.99
  weight_decay: 0.01
  max_grad_norm: 1.0
  warmup_ratio: 0.1

# ========================
# RL training
# ========================
rl_training_config:
  # max_steps computed as num_batches * num_epochs if not set
  eval_every_n_steps: 1000
  mini_batch_size: 128
  train_micro_batch_size: 2
  metrics_log_dir: "/tmp/tensorboard/deepscaler"
  metrics_flush_every_n_steps: 20
  checkpoint_root_directory: "/tmp/tunix/checkpoints/deepscaler"
  save_interval_steps: 500
  max_to_keep: 4
