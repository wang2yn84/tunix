# DeepScaleR recipe: DeepSeek-R1-Distill-Qwen-1.5B on math reasoning
#
# Reference:
#   https://pretty-radio-b75.notion.site/DeepScaleR-Surpassing-O1-Preview-with-a-1-5B-Model-by-Scaling-RL-19681902c1468005bed8ca303013a4e2
#
# Usage:
#   python -m tunix.cli.grpo_main \
#       examples/deepscaler/configs/deepseek_r1_distill_qwen_1.5b.yaml
#
# Override individual keys on the command line, e.g.:
#   python -m tunix.cli.grpo_main \
#       examples/deepscaler/configs/deepseek_r1_distill_qwen_1.5b.yaml \
#       rollout_engine=vllm \
#       agentic_grpo_config.num_generations=4

# ========================
# Model
# ========================
model_config:
  model_name: "deepseek_r1_distill_qwen_1_5b"
  model_id: "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"
  model_source: "huggingface"
  # model_path: "gs://tunix/models/DeepSeek-R1-Distill-Qwen-1.5B"
  rng_seed: 42
  model_display: false

actor_model_config:
  mesh:
    shape: "(4,1)"
    axis_names: "('fsdp','tp')"
  # Optional LoRA — uncomment to enable
  # lora_config:
  #   rank: 64
  #   alpha: 64.0
  #   module_path: ".*q_einsum|.*kv_einsum|.*gate_proj|.*down_proj|.*up_proj|.*attn_vec_einsum"

reference_model_config:
  mesh:
    shape: "(4,1)"
    axis_names: "('fsdp','tp')"

rollout_model_config:
  mesh:
    shape: "(4,1)"
    axis_names: "('fsdp','tp')"

tokenizer_config:
  tokenizer_type: "huggingface"
  tokenizer_path: "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"
  add_bos: false
  add_eos: false

# ========================
# Data module
# ========================
# tunix.cli.recipes.deepscaler_data.create_dataset(**data_config)
data_module: "tunix.cli.recipes.deepscaler_data"
data_config:
  train_data_path: "gs://tunix/data/DeepScaleR-Preview-Dataset/deepscaler.json"
  eval_data_path: "gs://tunix/data/HuggingFaceH4/aime_2024/train-00000-of-00001.parquet"
  shuffle: false
  seed: 42

prompt_key: "prompts"

# ========================
# Training loop
# ========================
seed: 42
batch_size: 128
num_batches: 312
num_train_epochs: 3
train_fraction: 0.8

# ========================
# Reward functions
# ========================
reward_functions:
  - "tunix/utils/math_rewards.py"

verl_compatible: false
training_mode: "agentic_grpo"

# ========================
# Rollout engine
# ========================
# One of: "vanilla", "vllm", "sglang_jax"
rollout_engine: "sglang_jax"
offload_to_cpu: false

rollout_config:
  max_prompt_length: 2048
  total_generation_steps: 8192  # = max_response_length
  temperature: 0.8
  top_p: 0.95
  top_k: null
  # kv_cache_size = max_prompt_length + total_generation_steps + 256  (single-turn)

# SGLang-JAX config (used when rollout_engine=sglang_jax)
sglang_jax_config:
  mem_fraction_static: 0.8
  init_with_random_weights: true
  disable_radix_cache: true
  enable_deterministic_sampling: false
  chunked_prefill_size: 2048
  page_size: 128
  use_sort_for_toppk_minp: false

# vLLM config (used when rollout_engine=vllm)
vllm_config:
  hbm_utilization: 0.4
  tpu_backend_type: "jax"
  server_mode: true
  async_scheduling: true
  max_num_seqs: 768
  # max_num_batched_tokens = (max_num_seqs * kv_cache_size) // 4  (computed)
  kwargs:
    kv_cache_metrics: true
    disable_log_stats: false
    enable_prefix_caching: true

# ========================
# Chat parser
# ========================
chat_parser_config:
  type: "default"

# ========================
# Agent / env (null = single-turn reward-based, no agent/env classes needed)
# ========================
agent_class_path: null
agent_kwargs: {}
env_class_path: null
env_kwargs: {}

# ========================
# Kubernetes (not used for DeepScaleR)
# ========================
kubernetes_config: null

# ========================
# Split mesh (disabled: use explicit meshes in actor/rollout_model_config above)
# ========================
split_mesh_config:
  enabled: false

# ========================
# Agentic GRPO algorithm
# ========================
agentic_grpo_config:
  num_generations: 8
  num_iterations: 1
  # max_response_length = rollout_config.total_generation_steps  (auto)
  beta: 0.0
  epsilon: 0.2
  epsilon_high: 0.28
  system_prompt: ""
  max_concurrency: 768
  off_policy_steps: 0
  loss_agg_mode: "token-mean"
  kl_loss_mode: "low_var_kl"
  # Single-turn: max_turns=1
  max_turns: 1
  context_ratio: 1

# ========================
# RL training
# ========================
rl_training_config:
  eval_every_n_steps: 1000
  mini_batch_size: 128
  train_micro_batch_size: 2
  actor_optimizer_config:
    opt_type: "adamw"
    learning_rate: 1.0e-6
    schedule_type: "warmup_cosine_decay_schedule"
    init_value: 0.0
    end_value: 0.0
    warmup_ratio: 0.1
    b1: 0.9
    b2: 0.99
    weight_decay: 0.01
    max_grad_norm: 1.0
  metrics_logging_options:
    log_dir: "/tmp/tensorboard/deepscaler"
    flush_every_n_steps: 20
  checkpointing_options:
    save_interval_steps: 500
    max_to_keep: 4
  checkpoint_root_directory: "/tmp/tunix/checkpoints/deepscaler"
